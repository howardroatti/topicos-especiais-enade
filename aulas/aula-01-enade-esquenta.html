<h1 id="parte-1">Parte 1</h1>
<h3 id="o-que-%C3%A9-o-enade">O que é o ENADE?</h3>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="4" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="o-que-%C3%A9-o-enade-1">O que é o ENADE</h2>
<ul>
<li><strong>E</strong>xame <strong>N</strong>acional de <strong>D</strong>esempenho dos <strong>E</strong>studantes, aplicado pelo <strong>INEP</strong>.</li>
<li>É um dos pilares do <strong>SINAES</strong> (Sistema Nacional de Avaliação da Educação Superior).</li>
<li>Avalia o <strong>desempenho dos concluintes</strong> em relação às <strong>competências, habilidades e conteúdos</strong> previstos nas <strong>Diretrizes Curriculares Nacionais (DCN)</strong> do curso.</li>
<li><strong>Periodicidade trienal</strong> por área — Computação (CC e SI) foi avaliada em <strong>2023</strong>; a próxima é <strong>2026</strong>.</li>
<li><strong>Prova (4h):</strong> <strong>Formação Geral</strong> (comum a todas as áreas) + <strong>Componente Específico</strong> da área — questões <strong>objetivas e discursivas</strong>.</li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="5" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="por-que-o-enade-importa">Por que o ENADE importa</h2>
<div class="cols">
<div>
<p><strong>Para você, estudante</strong></p>
<ul>
<li>A <strong>participação regular</strong> é <strong>condição para colar grau</strong> (consta no histórico).</li>
<li>Mostra o quanto você <strong>integra</strong> o que aprendeu ao longo do curso.</li>
<li>Treino valioso para <strong>concursos</strong> e <strong>processos seletivos</strong>.</li>
</ul>
</div>
<div>
<p><strong>Para o curso e a FAESA</strong></p>
<ul>
<li>Gera o <strong>Conceito ENADE</strong>, o <strong>CPC</strong> e alimenta o <strong>IGC</strong>.</li>
<li>Impacta <strong>reconhecimento, reputação</strong> e a <strong>renovação</strong> do curso.</li>
<li><strong>O valor do seu diploma</strong> também depende desses conceitos.</li>
</ul>
</div>
</div>
<div class="aviso">⚠️ O desempenho é <strong>coletivo</strong>: "zerar de propósito" ou não levar a sério prejudica todo o curso — inclusive quem já se formou.</div>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="6" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="cuidados-na-hora-da-prova">Cuidados na hora da prova</h2>
<ul>
<li><strong>Leve a sério.</strong> Não é &quot;só mais uma prova&quot;: ela mede — e é registrada.</li>
<li><strong>Leia o texto-base com atenção.</strong> As questões são <strong>contextualizadas</strong> (situação-problema, tabela, gráfico, código). A resposta está na análise, não na memória.</li>
<li><strong>Gerencie o tempo.</strong> São 4h para Formação Geral + Específico, incluindo <strong>discursivas</strong>.</li>
<li><strong>Não deixe em branco</strong> e <strong>responda o questionário do estudante</strong>.</li>
<li><strong>Cuidado com distratores.</strong> As alternativas erradas costumam ser <strong>plausíveis</strong> — elimine com critério.</li>
</ul>

<h1 id="parte-2--%F0%9F%94%A5-esquenta">Parte 2 — <img class="emoji" draggable="false" alt="🔥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/1f525.svg" data-marp-twemoji=""/> Esquenta</h1>
<h3 id="20-quest%C3%B5es-estilo-enade--alternativas-a-a-d">20 questões estilo ENADE · alternativas A a D</h3>
<h4 id="10-de-banco-de-dados--10-de-an%C3%A1lise-de-dados--responda-antes-de-virar-o-slide">10 de Banco de Dados · 10 de Análise de Dados — responda antes de virar o slide!</h4>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="9" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q1--banco-de-dados">Q1 · Banco de Dados</h2>
<p>Uma coordenação de curso utiliza um sistema acadêmico cujo esquema relacional inclui <code>Aluno(Matricula, Nome, IdCurso)</code> e <code>Curso(IdCurso, NomeCurso)</code>. Para organizar uma atividade de integração, a secretaria precisa emitir uma lista contendo <strong>somente os nomes</strong> dos alunos matriculados no curso de <strong>Sistemas de Informação</strong> — sem os demais dados.</p>
<p>Assinale a expressão de <strong>álgebra relacional</strong> que produz corretamente essa lista.</p>
<p>A) π<sub>Nome</sub>( σ<sub>NomeCurso='Sistemas de Informação'</sub>( Aluno ⋈ Curso ) )<br />
B) π<sub>Nome</sub>( Aluno ⋈ Curso )<br />
C) σ<sub>NomeCurso='Sistemas de Informação'</sub>( Aluno ⋈ Curso )<br />
D) π<sub>NomeCurso</sub>( σ<sub>Nome='Sistemas de Informação'</sub>( Aluno ⋈ Curso ) )</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="10" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q1--resposta-a">Q1 · Resposta: <strong>A</strong></h2>
<p><strong>Relembrando (Unidade 3 — Álgebra Relacional):</strong> a <strong>seleção (σ)</strong> filtra <strong>linhas</strong> por um predicado; a <strong>projeção (π)</strong> escolhe <strong>colunas</strong>. A <strong>junção (⋈)</strong> combina <code>Aluno</code> e <code>Curso</code> pela chave <code>IdCurso</code>.</p>
<ul>
<li>O pedido &quot;<strong>apenas os nomes</strong> dos alunos de SI&quot; → junta as tabelas, <strong>filtra</strong> pelo curso (σ) e <strong>projeta</strong> só o <code>Nome</code> (π). <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li><strong>B</strong> não filtra o curso (traz todos); <strong>C</strong> filtra certo, mas <strong>sem projeção</strong> devolve a tupla inteira — não &quot;só os nomes&quot;; <strong>D</strong> projeta e filtra pelos <strong>atributos errados</strong>.</li>
</ul>
<div class="dica">💡 σ antes ou depois da junção dá o mesmo resultado — mas a projeção do <code>Nome</code> é obrigatória.</div>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="11" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q2--banco-de-dados">Q2 · Banco de Dados</h2>
<p>Uma loja virtual registra suas vendas em <code>Cliente(id, nome)</code>, <code>Pedido(id, id_cliente)</code> e <code>Item(id_pedido, qtd, valor)</code>. Para uma campanha de fidelidade, o marketing quer identificar os <strong>clientes de maior valor</strong>: aqueles cujo <strong>total gasto</strong> — a soma de <code>qtd*valor</code> considerando <strong>todos os itens de todos os seus pedidos</strong> — <strong>ultrapassa R$ 1.000,00</strong>.</p>
<p>Qual consulta SQL atende corretamente a esse requisito?</p>
<p>A) usa <code>WHERE SUM(qtd*valor) &gt; 1000</code> com <code>GROUP BY nome</code>.<br />
B) junta as três tabelas, agrupa por cliente e usa <code>HAVING SUM(qtd*valor) &gt; 1000</code>.<br />
C) agrupa por cliente e usa <code>HAVING qtd*valor &gt; 1000</code>.<br />
D) usa <code>WHERE valor &gt; 1000</code>, filtrando item a item.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="12" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q2--resposta-b">Q2 · Resposta: <strong>B</strong></h2>
<p><strong>Relembrando (Unidade 5 — SQL):</strong> <code>WHERE</code> filtra <strong>linhas antes</strong> de agrupar e <strong>não aceita</strong> funções de agregação; <code>HAVING</code> filtra <strong>grupos depois</strong> do <code>GROUP BY</code>.</p>
<ul>
<li>O critério é sobre um <strong>total por cliente</strong> (soma) → precisa <code>GROUP BY cliente</code> + <strong><code>HAVING SUM(qtd*valor) &gt; 1000</code></strong>. <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li><strong>A</strong> usa <code>SUM</code> no <code>WHERE</code> (erro clássico); <strong>C</strong> compara <strong>item a item</strong>, não o total; <strong>D</strong> filtra itens caros, não clientes que <strong>gastaram muito no conjunto</strong>.</li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="13" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q3--banco-de-dados">Q3 · Banco de Dados</h2>
<p>Ao projetar o banco de um sistema acadêmico, um analista modelou a tabela <code>R(Aluno, Disciplina, Professor)</code>, cuja chave primária é o par <code>(Aluno, Disciplina)</code>. Pela regra de negócio, <strong>cada disciplina é ministrada por um único professor</strong> (<code>Disciplina → Professor</code>). Na revisão, nota-se <strong>redundância</strong>: o professor de uma disciplina se repete em toda matrícula, e trocá-lo exigiria alterar <strong>várias linhas</strong> (anomalia de atualização).</p>
<p>Sobre a normalização de <code>R</code>, é correto afirmar que ela <strong>viola</strong> a:</p>
<p>A) 1FN, por conter um atributo multivalorado.<br />
B) 3FN, por uma dependência transitiva entre atributos não-chave.<br />
C) 2FN, pois um atributo não-chave depende apenas de <strong>parte</strong> da chave.<br />
D) Nenhuma; a relação já está na 3FN.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="14" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q3--resposta-c">Q3 · Resposta: <strong>C</strong></h2>
<p><strong>Relembrando (Unidade 4 — Normalização):</strong> 1FN = atributos <strong>atômicos</strong>; 2FN = sem <strong>dependência parcial</strong> (não-chave dependendo de <strong>parte</strong> de uma chave composta); 3FN = sem <strong>dependência transitiva</strong>.</p>
<ul>
<li>Chave = <code>(Aluno, Disciplina)</code>; como <strong><code>Disciplina → Professor</code></strong>, o <code>Professor</code> depende só de <strong>parte</strong> da chave → <strong>dependência parcial</strong> → viola a <strong>2FN</strong> (origem da redundância descrita). <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li>Não é transitiva (isso seria 3FN) nem atomicidade (1FN).</li>
</ul>
<div class="dica">💡 Correção: decompor em <code>Turma(Disciplina, Professor)</code> e <code>Matricula(Aluno, Disciplina)</code>.</div>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="15" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q4--banco-de-dados">Q4 · Banco de Dados</h2>
<p>No modelo conceitual de um sistema de cadastro, a entidade <code>Pessoa</code> foi especializada em <code>PessoaFisica</code> (CPF) e <code>PessoaJuridica</code> (CNPJ). A especialização é <strong>total</strong> (todo cadastro é PF <strong>ou</strong> PJ) e <strong>disjunta</strong> (nenhum é os dois). Ao mapear para o modelo relacional, a equipe quer <strong>evitar colunas frequentemente nulas</strong> e <strong>impedir</strong> que um mesmo cadastro seja classificado como PF e PJ ao mesmo tempo.</p>
<p>Qual estratégia de mapeamento atende melhor a esses requisitos?</p>
<p>A) Uma única tabela <code>Pessoa</code> com todas as colunas (CPF e CNPJ), a maioria nula.<br />
B) <code>Pessoa</code> + subtabelas por FK, permitindo ser física <strong>e</strong> jurídica ao mesmo tempo.<br />
C) Uma tabela <code>Pessoa</code> com listas de CPF/CNPJ separadas por vírgula.<br />
D) Uma tabela por subtipo, cada uma com os atributos comuns de <code>Pessoa</code>.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="16" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q4--resposta-d">Q4 · Resposta: <strong>D</strong></h2>
<p><strong>Relembrando (Unidade 4 — Generalização/Especialização):</strong> <em>total</em> = todo supertipo é <strong>algum</strong> subtipo; <em>disjunta</em> = é <strong>exatamente um</strong>. Há 3 estratégias de mapeamento; a escolha depende dessas restrições.</p>
<ul>
<li>Para <strong>total + disjunta</strong>, &quot;<strong>uma tabela por subtipo</strong>&quot; (sem tabela do supertipo) <strong>elimina os nulos</strong> e preserva a exclusividade. <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li><strong>A</strong> gera muitas colunas <strong>nulas</strong>; <strong>B</strong> permitiria <strong>sobreposição</strong> (fere a disjunção); <strong>C</strong> fere a <strong>1FN</strong>.</li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="17" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q5--banco-de-dados">Q5 · Banco de Dados</h2>
<p>Em um sistema bancário, a transação <code>T1</code> consulta o <strong>saldo</strong> de uma conta para exibi-lo na tela. Antes de <code>T1</code> concluir, a transação <code>T2</code> <strong>credita um valor e confirma (commit)</strong>. Quando <code>T1</code>, ainda em andamento, <strong>consulta novamente</strong> o saldo da <strong>mesma conta</strong>, obtém um <strong>valor diferente</strong> do lido inicialmente.</p>
<p>A anomalia de controle de concorrência caracterizada nessa situação é a:</p>
<p>A) Leitura não repetível (<em>non-repeatable read</em>).<br />
B) Leitura suja (<em>dirty read</em>).<br />
C) Perda de atualização (<em>lost update</em>).<br />
D) Situação normal, sem anomalia.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="18" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q5--resposta-a">Q5 · Resposta: <strong>A</strong></h2>
<p><strong>Relembrando (Unidade 6 — Transações):</strong> a &quot;escada&quot; de anomalias de concorrência —</p>
<ul>
<li><strong>Dirty read:</strong> ler dado <strong>não confirmado</strong>.</li>
<li><strong>Non-repeatable read:</strong> reler a <strong>mesma linha</strong> e achar valor diferente (update <strong>confirmado</strong> no meio). <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> <em>(é o caso)</em></li>
<li><strong>Phantom:</strong> <strong>novas linhas</strong> aparecem num filtro relido.</li>
<li><strong>Lost update:</strong> duas escritas se sobrepõem.</li>
</ul>
<p>Evita-se a leitura não repetível a partir do isolamento <strong><code>REPEATABLE READ</code></strong>.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="19" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q6--banco-de-dados">Q6 · Banco de Dados</h2>
<p>Em um SGBD com bloqueio de duas fases (2PL), duas transações executam em paralelo. <code>T1</code> obtém bloqueio sobre o registro <code>A</code> e <code>T2</code> sobre o registro <code>B</code>. Em seguida, <code>T1</code> solicita bloqueio sobre <code>B</code> (retido por <code>T2</code>) e <code>T2</code> solicita bloqueio sobre <code>A</code> (retido por <code>T1</code>). Ambas ficam <strong>paradas indefinidamente</strong>, cada uma esperando um recurso que a outra detém.</p>
<p>Sobre a situação descrita, assinale a alternativa correta.</p>
<p>A) O 2PL <strong>garante</strong> que deadlocks nunca ocorram.<br />
B) Ocorre <strong>deadlock</strong>; o SGBD detecta, escolhe uma <strong>vítima</strong> e faz <strong>rollback</strong>.<br />
C) As duas transações concluem sem qualquer espera.<br />
D) O fenômeno observado é uma <strong>leitura fantasma</strong>.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="20" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q6--resposta-b">Q6 · Resposta: <strong>B</strong></h2>
<p><strong>Relembrando (Unidade 6 — Concorrência):</strong> o <strong>2PL</strong> garante <strong>serialização</strong> (transações crescem e depois só liberam bloqueios), mas <strong>não evita deadlock</strong>.</p>
<ul>
<li><code>T1</code> espera <code>B</code> (com <code>T2</code>) e <code>T2</code> espera <code>A</code> (com <code>T1</code>) → <strong>espera circular</strong> = <strong>deadlock</strong>. <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li>O SGBD mantém um <strong>grafo de espera</strong>, detecta o ciclo, <strong>aborta uma vítima</strong> e faz <strong>rollback</strong>; a outra prossegue.</li>
</ul>
<div class="dica">💡 Prevenção alternativa por timestamp: <em>esperar-morrer</em> (wait-die) / <em>ferir-esperar</em> (wound-wait).</div>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="21" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q7--banco-de-dados">Q7 · Banco de Dados</h2>
<p>Um SGBD utiliza log com <strong>write-ahead logging (WAL)</strong>. Uma <strong>falha de energia</strong> reinicia o servidor. Ao ler o log, a recuperação constata que a transação <code>T1</code> havia registrado <code>commit</code> <strong>antes</strong> da falha (embora suas páginas talvez não tenham ido ao disco), enquanto a transação <code>T2</code> estava <strong>em andamento</strong>, <strong>sem</strong> <code>commit</code>.</p>
<p>Para garantir a <strong>atomicidade</strong> e a <strong>durabilidade</strong>, o procedimento de recuperação deve aplicar:</p>
<p>A) UNDO em <code>T1</code> e REDO em <code>T2</code>.<br />
B) REDO em ambas.<br />
C) REDO em <code>T1</code> e UNDO em <code>T2</code>.<br />
D) Nenhuma ação; o <code>commit</code> de <code>T1</code> dispensa recuperação.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="22" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q7--resposta-c">Q7 · Resposta: <strong>C</strong></h2>
<p><strong>Relembrando (Unidade 6 — Recuperação):</strong> no <strong>Write-Ahead Logging</strong>, o <strong>log</strong> vai ao disco <strong>antes</strong> dos dados. Na recuperação:</p>
<ul>
<li>Transações <strong>confirmadas</strong> (mas talvez não gravadas) → <strong>REDO</strong> (refaz) → é o caso de <code>T1</code> (durabilidade).</li>
<li>Transações <strong>não confirmadas</strong> → <strong>UNDO</strong> (desfaz) → é o caso de <code>T2</code> (atomicidade). <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li>O <strong>checkpoint</strong> limita até onde o REDO precisa retroceder no log.</li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="23" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q8--banco-de-dados">Q8 · Banco de Dados</h2>
<p>Uma equipe de banco de dados analisa consultas sobre uma tabela com <strong>milhões de linhas</strong> e decide onde criar índices, ponderando o <strong>ganho na leitura</strong> contra o <strong>custo de manutenção</strong> (escrita e espaço) de cada índice.</p>
<p>Em qual das situações a seguir a criação de um índice <strong>tende a NÃO trazer ganho</strong> de desempenho?</p>
<p>A) Coluna <code>cpf</code> <strong>única</strong>, usada em <code>WHERE cpf = ...</code>.<br />
B) <strong>Chave estrangeira</strong> usada com frequência em <code>JOIN</code>.<br />
C) Coluna de data usada em faixas (<code>BETWEEN</code>).<br />
D) Coluna de <strong>baixa seletividade</strong> (poucos valores distintos) cujo filtro retorna <strong>metade</strong> das linhas.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="24" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q8--resposta-d">Q8 · Resposta: <strong>D</strong></h2>
<p><strong>Relembrando (Unidade 3 — Índices):</strong> um índice compensa quando a busca é <strong>seletiva</strong> (retorna <strong>poucas</strong> linhas), evitando a <strong>varredura completa</strong>.</p>
<ul>
<li>Numa coluna de <strong>baixa seletividade</strong> (ex.: um booleano) cujo filtro devolve <strong>metade</strong> da tabela, o otimizador prefere o <strong>full scan</strong> — e o índice ainda <strong>onera</strong> escrita e espaço. <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> <em>(NÃO ajuda)</em></li>
<li>Igualdade em coluna <strong>única</strong> (A), <strong>FKs</strong> em junções (B) e <strong>faixas</strong> de data (C) são justamente onde o índice <strong>ajuda</strong>.</li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="25" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q9--banco-de-dados">Q9 · Banco de Dados</h2>
<p>Uma empresa de e-commerce global mantém o <strong>carrinho de compras</strong> de milhões de usuários em servidores espalhados por vários continentes. O requisito é que o carrinho <strong>continue disponível e aceitando itens</strong> mesmo durante <strong>falhas de comunicação (partições) entre os data centers</strong>, admitindo-se que, por breves instantes, réplicas fiquem <strong>temporariamente inconsistentes</strong>.</p>
<p>À luz do <strong>Teorema CAP</strong>, a arquitetura adequada a esse requisito é:</p>
<p>A) Sistema <strong>AP</strong> (disponibilidade + tolerância a partição) com <strong>consistência eventual</strong>.<br />
B) Sistema <strong>CA</strong> que garante <strong>as três</strong> propriedades simultaneamente.<br />
C) Banco relacional com <strong>bloqueio global síncrono</strong> entre todos os nós.<br />
D) Sistema <strong>CP</strong> que <strong>recusa escritas</strong> durante a partição.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="26" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q9--resposta-a">Q9 · Resposta: <strong>A</strong></h2>
<p><strong>Relembrando (Unidade 7 — NoSQL / CAP):</strong> sob <strong>partição de rede</strong> (P), é preciso escolher entre <strong>Consistência (C)</strong> e <strong>Disponibilidade (A)</strong> — ter as três ao mesmo tempo é <strong>impossível</strong>.</p>
<ul>
<li>O carrinho precisa <strong>aceitar escritas</strong> e <strong>ficar disponível</strong> → <strong>AP</strong>, reconciliando depois (<strong>consistência eventual</strong>, modelo <strong>BASE</strong>, típico de bancos de documento/chave-valor). <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li><strong>B</strong> é impossível sob partição; <strong>D</strong> (CP) recusaria escritas; <strong>C</strong> não escala globalmente.</li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="27" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q10--banco-de-dados">Q10 · Banco de Dados</h2>
<p>Buscando desempenho, a equipe de infraestrutura de um SGBD <strong>reorganiza o armazenamento físico</strong> de uma tabela e <strong>cria novos índices</strong>. Após a mudança, constata-se que <strong>nenhum programa de aplicação precisou ser alterado</strong> e o <strong>esquema conceitual</strong> permaneceu o mesmo.</p>
<p>Na arquitetura de três níveis (<strong>ANSI-SPARC</strong>), essa situação ilustra a:</p>
<p>A) Independência <strong>lógica</strong> de dados.<br />
B) Independência <strong>física</strong> de dados.<br />
C) Ausência de independência de dados.<br />
D) Independência <strong>referencial</strong>.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="28" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q10--resposta-b">Q10 · Resposta: <strong>B</strong></h2>
<p><strong>Relembrando (Unidade 2 — Arquitetura ANSI-SPARC):</strong> três níveis — <strong>externo</strong> (views), <strong>conceitual</strong> (esquema lógico) e <strong>interno</strong> (físico/armazenamento).</p>
<ul>
<li>Mudar o nível <strong>interno</strong> (índices, armazenamento) <strong>sem afetar</strong> o conceitual/aplicações = <strong>independência física</strong>. <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li>A <strong>independência lógica</strong> seria mudar o <strong>esquema conceitual</strong> sem afetar as <strong>views</strong>/aplicações — não é o caso aqui.</li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="29" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q11--an%C3%A1lise-de-dados">Q11 · Análise de Dados</h2>
<p>Um analista de RH examina os salários (em R$) de uma pequena equipe: <strong>2000, 2200, 2500, 2800 e 50000</strong> — este último, de um sócio-diretor. Ele precisa reportar à diretoria um <strong>valor que represente o salário típico</strong> da equipe, evitando uma medida <strong>distorcida pelo valor atípico</strong>.</p>
<p>Assinale a alternativa correta.</p>
<p>A) A média (~11 900) é a melhor medida, pois usa todos os valores.<br />
B) A moda é a única medida válida para dados numéricos.<br />
C) A mediana (2500) representa melhor o típico, pois é robusta a <em>outliers</em>.<br />
D) O valor extremo (50000) não afeta a média.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="30" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q11--resposta-c">Q11 · Resposta: <strong>C</strong></h2>
<p><strong>Relembrando (Estatística descritiva):</strong> a <strong>média</strong> usa todos os valores e por isso é <strong>sensível a <em>outliers</em></strong>; a <strong>mediana</strong> (valor central) é <strong>robusta</strong>.</p>
<ul>
<li>O salário de 50000 puxa a <strong>média</strong> para ~11 900 — que <strong>não representa</strong> ninguém do grupo. A <strong>mediana (2500)</strong> descreve melhor o &quot;típico&quot;. <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li>Em distribuições <strong>assimétricas</strong>, prefira a mediana (é o que o <strong>boxplot</strong> evidencia).</li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="31" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q12--an%C3%A1lise-de-dados">Q12 · Análise de Dados</h2>
<p>Dois times de vendas têm o <strong>mesmo faturamento médio</strong> mensal. Ao inspecionar os dados, um analista percebe que, no <strong>time A</strong>, os valores mensais ficam <strong>muito próximos da média</strong>, enquanto no <strong>time B</strong> eles <strong>oscilam bastante</strong> (meses muito altos e muito baixos).</p>
<p>Sobre as medidas de dispersão aplicáveis a essa comparação, assinale a alternativa correta.</p>
<p>A) Desvio-padrão e IQR não têm relação com dispersão.<br />
B) O IQR é sensível a <em>outliers</em>, por isso deve ser evitado.<br />
C) Como as médias são iguais, o desvio-padrão também será.<br />
D) O <strong>time B</strong> tem <strong>maior desvio-padrão</strong>; o <strong>IQR</strong> mede os 50% centrais e é robusto a <em>outliers</em>.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="32" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q12--resposta-d">Q12 · Resposta: <strong>D</strong></h2>
<p><strong>Relembrando (Medidas de variabilidade):</strong> o <strong>desvio-padrão</strong> mede o espalhamento <strong>em torno da média</strong> — logo, <strong>mesma média não significa mesma dispersão</strong>.</p>
<ul>
<li>O <strong>time B</strong>, que oscila mais, tem <strong>maior desvio-padrão</strong>. <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li>O <strong>IQR</strong> = Q3 − Q1 resume os <strong>50% centrais</strong> e é <strong>robusto a <em>outliers</em></strong> (por isso o <strong>boxplot</strong> usa quartis). O desvio-padrão <strong>nunca</strong> é negativo.</li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="33" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q13--an%C3%A1lise-de-dados">Q13 · Análise de Dados</h2>
<p>Uma equipe de vendas prepara um relatório para mostrar à diretoria a <strong>evolução do faturamento mensal</strong> ao longo de um ano (de janeiro a dezembro), de modo a <strong>evidenciar a tendência</strong> de crescimento no período.</p>
<p>Qual tipo de gráfico é o <strong>mais adequado</strong> para representar esses dados?</p>
<p>A) Gráfico de <strong>linhas</strong>, que mostra a evolução de um valor ao longo do tempo.<br />
B) Gráfico de <strong>pizza</strong>, indicado para comparar a evolução temporal.<br />
C) <strong>Histograma</strong>, próprio para exibir séries temporais.<br />
D) Gráfico de <strong>dispersão</strong> entre o mês e o nome do produto.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="34" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q13--resposta-a">Q13 · Resposta: <strong>A</strong></h2>
<p><strong>Relembrando (Análise Exploratória — Visualização):</strong> cada tipo de gráfico responde a uma pergunta diferente sobre os dados.</p>
<ul>
<li><strong>Linhas</strong> → evolução de um valor <strong>ao longo do tempo</strong> (tendência) → é exatamente o caso. <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li><strong>Pizza</strong> mostra a <strong>proporção</strong> de um todo (não evolução); o <strong>histograma</strong> exibe a <strong>distribuição de frequências</strong> de uma variável numérica; a <strong>dispersão</strong> relaciona <strong>duas variáveis numéricas</strong>.</li>
</ul>
<div class="dica">💡 Escolha o gráfico pela pergunta: comparar, evoluir (tempo), distribuir ou relacionar.</div>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="35" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q14--an%C3%A1lise-de-dados">Q14 · Análise de Dados</h2>
<p>Uma equipe de dados faz um <strong>teste A/B</strong> para saber se uma nova versão do site aumenta a conversão. Define a hipótese nula <strong>H₀</strong> (não há diferença) e adota nível de significância <strong>α = 0,05</strong>. Ao final do experimento, obtém <strong>p-valor = 0,03</strong>.</p>
<p>Com base nesse resultado, assinale a decisão e a interpretação corretas.</p>
<p>A) O p-valor é a <strong>probabilidade de H₀ ser verdadeira</strong>.<br />
B) Como <strong>p (0,03) &lt; α (0,05)</strong>, <strong>rejeita-se H₀</strong>; o p-valor é a probabilidade de um resultado tão ou mais extremo, <strong>supondo H₀ verdadeira</strong>.<br />
C) Como p &lt; α, <strong>aceita-se H₀</strong>.<br />
D) Rejeitar H₀ sendo ela verdadeira é <strong>erro tipo II</strong>.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="36" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q14--resposta-b">Q14 · Resposta: <strong>B</strong></h2>
<p><strong>Relembrando (Testes de hipótese / experimentos estatísticos):</strong> o <strong>p-valor</strong> mede quão extremos são os dados <strong>supondo H₀ verdadeira</strong> — <strong>não</strong> é &quot;a probabilidade de H₀&quot;.</p>
<ul>
<li>Regra de decisão: <strong>p &lt; α ⇒ rejeita-se H₀</strong>. Aqui 0,03 &lt; 0,05 → rejeita. <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li><strong>Erro tipo I</strong> = rejeitar H₀ <strong>verdadeira</strong> (probabilidade = α); <strong>erro tipo II</strong> = <strong>não</strong> rejeitar H₀ <strong>falsa</strong>. Um p pequeno é <strong>evidência contra H₀</strong>, não &quot;prova&quot; de H₁.</li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="37" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q15--an%C3%A1lise-de-dados">Q15 · Análise de Dados</h2>
<p>Uma empresa ajusta um modelo de <strong>regressão linear</strong> entre o <strong>investimento mensal em anúncios</strong> (x) e as <strong>vendas</strong> (y). O modelo tem coeficiente <strong>angular positivo</strong> e <strong>R² = 0,64</strong>. A partir disso, um gerente conclui que &quot;aumentar anúncios <strong>causa</strong> aumento de vendas&quot;.</p>
<p>Sobre a interpretação correta desses resultados, assinale a alternativa correta.</p>
<p>A) O R² = 0,64 <strong>prova</strong> que anúncios <strong>causam</strong> vendas.<br />
B) Coeficiente angular positivo indica <strong>correlação negativa</strong>.<br />
C) O <strong>R² = 0,64</strong> indica que <strong>64% da variabilidade</strong> das vendas é explicada pelo modelo; <strong>correlação não implica causalidade</strong>.<br />
D) Correlação de 0,64 significa <strong>64% de acurácia</strong> de classificação.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="38" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q15--resposta-c">Q15 · Resposta: <strong>C</strong></h2>
<p><strong>Relembrando (Regressão):</strong> o <strong>R²</strong> é a proporção da <strong>variabilidade</strong> de <code>y</code> <strong>explicada</strong> pelo modelo (0,64 = <strong>64%</strong>; o resto é erro/outros fatores).</p>
<ul>
<li>O coeficiente <strong>angular</strong> dá a variação de <code>y</code> por unidade de <code>x</code> (é <strong>diferente</strong> do R²). <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li>Alerta clássico do ENADE: a conclusão do gerente é indevida — <strong>correlação/regressão ≠ causalidade</strong> (pode haver <strong>variável de confusão</strong>).</li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="39" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q16--an%C3%A1lise-de-dados">Q16 · Análise de Dados</h2>
<p>Um cientista de dados treina um classificador e observa <strong>acurácia de 99% no conjunto de treino</strong>, mas apenas <strong>70% no conjunto de teste</strong> (dados não vistos). Tudo indica que o modelo &quot;<strong>decorou</strong>&quot; os exemplos de treino.</p>
<p>Assinale o diagnóstico e a mitigação corretos.</p>
<p>A) <em>Underfitting</em>; aumentar a complexidade do modelo.<br />
B) O modelo está ideal, pois errou pouco no treino.<br />
C) Vazamento de dados, que garante boa generalização.<br />
D) <em>Overfitting</em>; mitigar com mais dados, regularização, menor complexidade e validação cruzada.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="40" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q16--resposta-d">Q16 · Resposta: <strong>D</strong></h2>
<p><strong>Relembrando (Machine Learning — viés × variância):</strong> um <strong>vão</strong> entre bom desempenho no <strong>treino</strong> e ruim no <strong>teste</strong> = <strong>overfitting</strong> — o modelo <strong>memorizou</strong> o treino (<strong>alta variância</strong>) e <strong>não generaliza</strong>.</p>
<ul>
<li>Mitigações: <strong>mais dados</strong>, <strong>regularização</strong>, <strong>reduzir a complexidade</strong> e <strong>validação cruzada</strong>. <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li><strong>Underfitting</strong> seria erro <strong>alto nos dois</strong> (modelo simples demais).</li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="41" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q17--an%C3%A1lise-de-dados">Q17 · Análise de Dados</h2>
<p>Em um sistema de <strong>detecção de fraude</strong>, apenas <strong>1% das transações são fraudulentas</strong> (99% legítimas). Um modelo simplório que classifica <strong>toda</strong> transação como &quot;legítima&quot; alcança <strong>99% de acurácia</strong>, mas <strong>não detecta nenhuma fraude</strong>.</p>
<p>Sobre a avaliação de desempenho nesse cenário desbalanceado, assinale a alternativa correta.</p>
<p>A) A <strong>acurácia é enganosa</strong>; <strong>precisão, revocação e F1</strong> avaliam melhor a classe minoritária.<br />
B) A acurácia de 99% indica boa detecção de fraudes.<br />
C) A revocação mede a proporção de <strong>negativos</strong> corretos.<br />
D) O F1 ignora os <strong>falsos negativos</strong>.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="42" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q17--resposta-a">Q17 · Resposta: <strong>A</strong></h2>
<p><strong>Relembrando (Classificação — métricas):</strong> em dados <strong>desbalanceados</strong>, a <strong>acurácia engana</strong>: &quot;sempre legítima&quot; acerta 99%, mas tem <strong>revocação 0</strong> para fraude — <strong>inútil</strong>.</p>
<ul>
<li><strong>Revocação</strong> = TP/(TP+FN): quantas fraudes <strong>capturei</strong>. <strong>Precisão</strong> = TP/(TP+FP). <strong>F1</strong> = média harmônica das duas. <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li>Use <strong>precisão/revocação/F1</strong> (ou <strong>AUC</strong>) para a classe <strong>rara</strong>. <em>(Lembre da matriz de confusão.)</em></li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="43" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q18--an%C3%A1lise-de-dados">Q18 · Análise de Dados</h2>
<p>Uma rede de varejo possui uma base de <strong>clientes sem rótulos</strong> (não há categoria previamente definida) e deseja <strong>descobrir grupos</strong> de clientes com comportamento de compra semelhante, para direcionar campanhas específicas a cada perfil.</p>
<p>Qual abordagem de aprendizado de máquina é adequada a esse objetivo?</p>
<p>A) Aprendizado <strong>supervisionado</strong> (classificação), pois há rótulos definidos.<br />
B) Aprendizado <strong>não supervisionado</strong> (clusterização, ex.: <em>k-means</em>), que agrupa por similaridade.<br />
C) <strong>Regressão linear</strong>, para prever o grupo.<br />
D) É preciso <strong>rotular manualmente</strong> todos os clientes antes de qualquer análise.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="44" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q18--resposta-b">Q18 · Resposta: <strong>B</strong></h2>
<p><strong>Relembrando (Tipos de aprendizado):</strong> <strong>supervisionado</strong> usa dados <strong>rotulados</strong> (<code>y</code> conhecido: classificação/regressão); <strong>não supervisionado</strong> <strong>não tem rótulo</strong> e busca <strong>estrutura</strong> nos dados.</p>
<ul>
<li><strong>Descobrir grupos</strong> em clientes <strong>sem rótulos</strong> = <strong>clusterização</strong> (não supervisionado), ex.: <strong>k-means</strong>, que agrupa por <strong>distância/similaridade</strong>. <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li>Sem <code>y</code>, não cabe classificação nem regressão.</li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="45" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q19--an%C3%A1lise-de-dados">Q19 · Análise de Dados</h2>
<p>Um analista usa a biblioteca <strong>pandas</strong> para resumir as vendas por região e executa o código a seguir:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> pandas <span class="hljs-keyword">as</span> pd
df = pd.DataFrame({<span class="hljs-string">&#x27;regiao&#x27;</span>: [<span class="hljs-string">&#x27;S&#x27;</span>,<span class="hljs-string">&#x27;N&#x27;</span>,<span class="hljs-string">&#x27;S&#x27;</span>,<span class="hljs-string">&#x27;N&#x27;</span>],
                   <span class="hljs-string">&#x27;venda&#x27;</span>:  [<span class="hljs-number">10</span>, <span class="hljs-number">20</span>, <span class="hljs-number">30</span>, <span class="hljs-number">40</span>]})
r = df.groupby(<span class="hljs-string">&#x27;regiao&#x27;</span>)[<span class="hljs-string">&#x27;venda&#x27;</span>].mean()
</code></pre>
<p>Assinale a alternativa que descreve corretamente o conteúdo de <code>r</code>.</p>
<p>A) Uma <em>Series</em> com a soma: S = 40, N = 60.<br />
B) Um <em>DataFrame</em> com todas as linhas originais.<br />
C) Uma <em>Series</em> com a média por região: S = 20.0 e N = 30.0.<br />
D) Erro, pois <code>groupby</code> não aceita coluna categórica.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="46" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q19--resposta-c">Q19 · Resposta: <strong>C</strong></h2>
<p><strong>Relembrando (pandas — <em>split-apply-combine</em>):</strong> <code>groupby('regiao')['venda'].mean()</code> <strong>agrupa</strong> pela região e calcula a <strong>média</strong> de <code>venda</code> em cada grupo.</p>
<ul>
<li><strong>S:</strong> (10 + 30) / 2 = <strong>20.0</strong>; <strong>N:</strong> (20 + 40) / 2 = <strong>30.0</strong>. <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li>O resultado é uma <strong>Series</strong> indexada pela <code>regiao</code> — não a soma, nem o primeiro valor, nem o DataFrame inteiro.</li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="47" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q20--an%C3%A1lise-de-dados">Q20 · Análise de Dados</h2>
<p>Ao preparar os dados de um modelo, um estagiário <strong>normaliza (escalona) todo o conjunto</strong> usando a média e o desvio calculados sobre <strong>todos os registros</strong> e, <strong>em seguida</strong>, separa em treino e teste. Na avaliação, o modelo apresenta métricas <strong>excelentes</strong> — que <strong>não se confirmam em produção</strong>.</p>
<p>Sobre o procedimento adotado, assinale a alternativa correta.</p>
<p>A) Não há problema; escalonar antes de dividir é a prática recomendada.<br />
B) O correto é ajustar no teste e aplicar no treino.<br />
C) Vazamento de dados melhora a generalização.<br />
D) Há <strong>vazamento de dados</strong>: o <em>scaler</em> usou estatísticas do teste; o certo é ajustar (<strong>fit</strong>) só no treino e aplicar (<strong>transform</strong>) no teste.</p>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" data-marpit-pagination="48" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
<h2 id="q20--resposta-d">Q20 · Resposta: <strong>D</strong></h2>
<p><strong>Relembrando (Feature engineering / pré-processamento):</strong> calcular média/desvio do escalonamento sobre <strong>treino + teste</strong> deixa informação do <strong>teste vazar</strong> para o treino (<em><strong>data leakage</strong></em>) e <strong>infla</strong> as métricas — que depois <strong>não se confirmam</strong> em produção.</p>
<ul>
<li>Regra de ouro: <strong><code>fit</code> só no treino</strong>, <strong><code>transform</code></strong> no teste. <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li>Um <strong><code>Pipeline</code></strong> + <strong><code>train_test_split</code></strong> (estratificado, em classificação) garante isso <strong>automaticamente</strong>.</li>
</ul>
<footer>Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-footer="Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2" data-class="secao" data-theme="rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme" lang="pt-BR" class="secao" data-marpit-pagination="49" style="--paginate:true;--footer:Prof. M.Sc. Howard Cruz Roatti · FAESA · Tópicos Especiais II — ENADE · 2026/2;--class:secao;--theme:rcigmpz9z3n0n0ykssdntwlvdwa0snde5mokzbgjnme;" data-marpit-pagination-total="49">
